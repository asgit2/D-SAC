version: '3.8'

services:
  deployment-console:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      JAVA_OPTS: "-Xmx512m -Xms256m"
    volumes:
      # Mount kubeconfig for Kubernetes access
      - ~/.kube/config:/root/.kube/config:ro
    networks:
      - deployment-network
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8080/api/clusters" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  deployment-network:
    driver: bridge
